# Local stack: API + observability (Prometheus, Loki, Alloy, Grafana).
# Internal services bind to 127.0.0.1 only. Copy .env.example to .env first.
name: __APP_NAME__

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # #if db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # #endif
    ports: ["3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    labels:
      logging: alloy # Alloy ships only containers carrying this label to Loki
    # #if db
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # #endif
  # #if db

  migrate:
    <<: *hardening
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/config/data-source.js"]
    read_only: true
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # #endif

  prometheus:
    image: prom/prometheus:v3.11.3
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.7.0
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]

  alloy:
    image: grafana/alloy:v1.21.0
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # read-only socket for container discovery; do not expose this service publicly
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["127.0.0.1:12345:12345"]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.0.0
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki]

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  # #if db
  postgres-data:
  # #endif
  prometheus-data:
  loki-data:
  grafana-data:
